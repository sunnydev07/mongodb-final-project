version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: mongo-final-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./../scripts:/scripts:ro
    environment:
      MONGO_INITDB_DATABASE: mongo_final_project
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mongo-final-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/mongo_final_project
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ../backups:/app/backups

volumes:
  mongo_data:
